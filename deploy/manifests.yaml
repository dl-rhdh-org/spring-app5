apiVersion: apps/v1
kind: Deployment
metadata:
  name: spring-app5
  namespace: spring-demos
  labels:
    app: spring-app5
    app.kubernetes.io/part-of: spring-app5
    app.openshift.io/runtime: spring-boot
    backstage.io/kubernetes-id: spring-app5
spec:
  replicas: 1
  selector:
    matchLabels:
      app: spring-app5
  template:
    metadata:
      labels:
        app: spring-app5
        app.kubernetes.io/part-of: spring-app5
        app.openshift.io/runtime: spring-boot
        backstage.io/kubernetes-id: spring-app5
    spec:
      containers:
      - name: app
        image: quay.io/openshifttest/hello-openshift:1.2.0
        ports:
        - containerPort: 8080
          name: http
        envFrom:
        - configMapRef:
            name: spring-app5-config
        - secretRef:
            name: spring-app5-secret
---
apiVersion: v1
kind: Service
metadata:
  name: spring-app5
  namespace: spring-demos
  labels:
    app: spring-app5
    backstage.io/kubernetes-id: spring-app5
spec:
  selector:
    app: spring-app5
  ports:
  - port: 8080
    targetPort: 8080
    name: http
---
apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: spring-app5
  namespace: spring-demos
  labels:
    app: spring-app5
    backstage.io/kubernetes-id: spring-app5
spec:
  to:
    kind: Service
    name: spring-app5
  port:
    targetPort: http
  tls:
    termination: edge
